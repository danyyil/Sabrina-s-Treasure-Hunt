<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Birthday Treasure Hunt</title>
  <style>
    :root { --ink:#2f2a24; --muted:#746b5f; --accent:#8b5e3c; --accent-dark:#6d472d; --success:#3e6848; --error:#8a4038; --card:rgba(255,252,242,0.92); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background: radial-gradient(circle at top, rgba(255,255,255,0.45), transparent 40%), linear-gradient(135deg,#e7dcc3,#f2ead8 45%,#ddd0b5); color:var(--ink); font-family: Georgia,"Times New Roman",serif; display:flex; justify-content:center; align-items:flex-start; padding:24px; }
    .hunt { width:min(720px,100%); margin:auto 0; }
    .header { text-align:center; margin-bottom:18px; }
    .eyebrow { text-transform:uppercase; letter-spacing:.18em; font-size:.75rem; color:var(--muted); margin-bottom:8px; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.2rem); font-weight:normal; }
    .progress { margin:20px 0 0; height:8px; border-radius:999px; background:rgba(47,42,36,.13); overflow:hidden; }
    .progress-bar { width:0; height:100%; background:var(--accent); border-radius:inherit; transition:width .5s ease; }
    .letters-wrap { display:none; margin-top:18px; }
    .letters-label { font-size:.8rem; color:var(--muted); margin-bottom:8px; }
    .letters { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
    .tile { width:2.6rem; height:3rem; display:grid; place-items:center; font-size:1.5rem; background:#fffdf7; border:1px solid rgba(47,42,36,.25); border-bottom:3px solid var(--accent); border-radius:8px; box-shadow:0 4px 10px rgba(63,52,37,.12); }
    .tile.new { animation: pop .6s ease; }
    @keyframes pop { 0% { transform:scale(.3) rotate(-8deg); opacity:0; } 60% { transform:scale(1.15); opacity:1; } 100% { transform:scale(1); } }
    .card { background:var(--card); border:1px solid rgba(47,42,36,.12); border-radius:18px; padding:clamp(28px,5vw,48px); box-shadow:0 18px 50px rgba(63,52,37,.14); backdrop-filter:blur(4px); }
    .stop { text-align:center; font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:22px; }
    .clue { max-width:600px; margin:0 auto 30px; font-size:clamp(1.15rem,2.3vw,1.35rem); line-height:1.85; }
    .clue p { margin:0 0 1.1em; white-space:pre-line; }
    .clue p.ask { font-style:italic; font-weight:bold; }
    .form { display:flex; gap:10px; max-width:520px; margin:0 auto; }
    input { flex:1; min-width:0; padding:14px 16px; border:1px solid rgba(47,42,36,.25); border-radius:10px; font:inherit; font-size:1rem; background:#fffdf7; color:var(--ink); outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(139,94,60,.12); }
    button { border:0; border-radius:10px; padding:14px 20px; font:inherit; cursor:pointer; transition:transform .15s ease, background .15s ease; }
    .submit, .next { background:var(--accent); color:#fff; }
    .submit:hover, .next:hover { background:var(--accent-dark); transform:translateY(-1px); }
    .hint-button { display:block; margin:16px auto 0; background:transparent; color:var(--muted); text-decoration:underline; padding:8px; }
    .hint-button:hover { color:var(--ink); }
    .hint { display:none; margin:18px auto 0; padding:14px 16px; max-width:520px; border-left:3px solid var(--accent); background:rgba(139,94,60,.07); line-height:1.6; color:var(--muted); }
    .feedback { min-height:28px; margin-top:18px; text-align:center; font-weight:bold; }
    .success { color:var(--success); } .error { color:var(--error); }
    .locked { pointer-events:none; opacity:.7; }
    .reward { display:none; margin-top:28px; padding-top:24px; border-top:1px solid rgba(47,42,36,.12); text-align:center; }
    .reward-letter { font-size:2.6rem; letter-spacing:.12em; margin:8px 0 18px; }
    @media (max-width:560px) { .form { flex-direction:column; } .submit { width:100%; } }
    @media (prefers-reduced-motion: reduce) { .tile.new { animation:none; } .progress-bar { transition:none; } }
  </style>
</head>
<body>
  <main class="hunt">
    <header class="header">
      <div class="eyebrow">A Birthday Treasure Hunt</div>
      <h1 id="title"></h1>
      <div class="progress" aria-label="Progress"><div id="bar" class="progress-bar"></div></div>
      <div id="lettersWrap" class="letters-wrap">
        <div class="letters-label">Letters found</div>
        <div id="letters" class="letters" aria-live="polite"></div>
      </div>
    </header>

    <section class="card">
      <div id="stop" class="stop"></div>
      <div id="clue" class="clue"></div>

      <form id="answerForm" class="form">
        <input id="answer" type="text" autocomplete="off" spellcheck="false" placeholder="Enter your answer..." aria-label="Answer" />
        <button class="submit" type="submit">Submit</button>
      </form>

      <button id="hintButton" class="hint-button" type="button">I need a hint</button>
      <div id="hint" class="hint"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>

      <div id="reward" class="reward">
        <div>You found a letter.</div>
        <div id="rewardLetter" class="reward-letter"></div>
        <button id="nextButton" class="next" type="button">Reveal the next clue</button>
      </div>
    </section>
  </main>

  <script>
    // Each stop: t = title, c = clue paragraphs ("*" prefix = the question), hint = hint text,
    // l = letter awarded, h = SHA-256 hashes of the accepted answers (so they aren't readable in view-source).
    // To add or change an answer later, open the browser console on this page and run:
    //   huntHash(STOP_NUMBER_STARTING_AT_0, "the answer").then(console.log)
    const STOPS = [
      { t:"The First Mark", l:"Q", h:["264a5587961363602a97cd7d05027b707d94400dee29cd2e5a9da55c14176b1e"],
        c:["Where Canada's emblems circle round,\nSeek the odd one out you've found.\nNot crown nor shield, nor shape so known—\nOne bears a form entirely its own.","*Name the land that broke the mould,\nAnd claim the letter you are told."],
        hint:"Look carefully at the shapes of the coats of arms. One is a circle." },
      { t:"The Two Travellers", l:"Z", h:["02c94550fa1954ac9e67230f20d3eedaf87388d344f6efe1f0a4d0d1bbea8c85"],
        c:["Two little wanderers, cast in bronze,\nKeep watch where old frontiers were drawn.\nBeneath their paws, where histories meet,\nThree tongues recall an older seat.","One name comes east from lands you know,\nAnd may strike closer than you suppose.","*Take the given name of the man\nWhose homeland echoes yours, if you can."],
        hint:"Read the inscription beneath the bronze pair. It appears in three languages, and one name in it should feel familiar." },
      { t:"The Lady and Her Companion", l:"K", h:["1fa7c43b63c32b403f70b591d5c6b1c1b2bb0c06bc0717ec688cec560ad84cee"],
        c:["A painter waits upon the street,\nWith an unexpected friend so sweet.\nNot canvas, brush, nor work of art\nWill tell you where the next clues start.","The town has given her a name—\nA simple title, known to fame.","*Find the words beside her stone,\nAnd speak the name the city has known."],
        hint:"Ignore the painting supplies. The answer is in the words written beside her." },
      { t:"The Watcher Above", l:"Z", h:["4459c9addfd7005f863cafd2d44cd7d931901db742c0dc2cf5ca59ab9718a023"],
        c:["Beyond the halls of gathered lore,\nA wooden house keeps ancient score.\nGreat carved guardians mark the way,\nAnd watching eyes are on display.","Seek the grin with teeth so wide,\nThen look upon the pole beside.","*What winged creature crowns the sky,\nResting where the tall carvings lie?"],
        hint:"Find the carving with the wide toothy grin, then look at the pole right next to it. Something with wings sits at the top." },
      { t:"The Palace of Fine Dining", l:"M", h:["0e43d33c2c1f4ac04e65d458ed95b572f79dba8c7a50246541b0869ad35c0e2f"],
        c:["At last, a temple to cuisine—\nThe finest feast your eyes have seen.\nA worthy shrine to pasta rare,\nWhere critics doubtless stop and stare.","Yet leave the menu on the shelf;\nThe answer hides upon the house itself.","*Seek the name the building bears,\nWritten quietly for those who care."],
        hint:"Don't go looking at the menu. The name is written on the building itself, so look up and around the outside." },
      { t:"The Glowing Gate", l:"X", h:["5ec9300be6645095ebe0a7e96ce7f472cbcb257bd1e6783be5d644e66a097ec3"],
        c:["A glowing sign shall mark the door,\nTo a little court you've passed before.\nDo not stray wide, nor wander far—\nYour prize lies close to where you are.","Down the road, then slightly left,\nLook for the entrance brightly dressed.","*Beside the light, a number waits.\nWhat number guards these hidden gates?"],
        hint:"You are looking for a glowing sign, and the number is posted right beside it. It has three digits." },
      { t:"The Zoo That Isn't", l:"S", h:["a9a2b6299af90b4b7782c78a6a6f287c4849c16cc29e990638bc9cc488b70632"],
        c:["Within this court there hides a place\nWhere many-legged things make their case.\nNo lion prowls, no tiger roars,\nYet still a keeper tends its doors.","Before you enter, look ahead—\nA northern beast stands carved instead.","*Name the creature guarding the zoo,\nAnd let the next secret come to you."],
        hint:"Look at what stands carved at the entrance before you go in. It's an animal you'd associate with Canada." },
      { t:"The Sweetest Trail", l:"I", h:["104e405344a467b9128078858faa806791890b6e18ed40f4cb53ac3db4cb4ce6", "000c4e08c64ca60a3f55947718761d9f8be29ed05eecaaa69370dd6b7ee7752b"],
        c:["A jaunty fellow waits nearby,\nWith moustached face and beret so sly.\nFollow the scent of sugar and shell\nTo the place where little treasures dwell.","But sweets are not the prize today;\nA number will point you on your way.","*Find the shop, then seek its ring—\nIts telephone number is the thing."],
        hint:"Find the sweet shop near the moustached fellow in the beret. Its phone number is displayed at the shop. Type just the digits." },
      { t:"The Temptation", l:"R", h:["9570a3a2b6f960c57609571c1b13519062f8d0ec8377dbf7b1c3bba193ff339b"],
        c:["Beware the hall of printed dreams,\nWhere shelves conceal more books than seems.\nWe've entered once with empty hands\nAnd left with treasures, contrary to plans.","Today, resist—at least for now—\nAnd turn your gaze outside somehow.","Upon the golden words you’ll see\nA year concealed for you and me.","*What year first saw this building rise?"],
        hint:"Stay outside. Look at the gold lettering on the front of the building, where a four-digit year is written." },
      { t:"The Pilgrimage of Oleh", l:"H", h:["e51a6b1bef219d5e1d6069b845546745a5debca9a669f37e357c2fa87d8a6475"],
        c:["There is a place, revered by one\nWho'd gladly spend his days there for fun.\nAmongst the boots and packs and gear,\nIts name is spoken with great cheer.","One traveller holds this place dearer\nThan any other place in British Columbia.","*Seek the letters on its door—\nThree of them will unlock the lore."],
        hint:"Think of the outdoor gear store he loves most. The answer is the three letters on its door." },
      { t:"The Narrow Way", l:"G", h:["551e147d01de7d72868ae3cae8ccf5d0afc74f7de086789fe323ce04b0e7070f"],
        c:["Through a passage slim and old,\nWhere stories linger, bought and sold,\nPass not yet beneath the stone—\nFirst seek a number carved alone.","Across from where the narrow way\nInvites the wandering feet to stray,\nA building keeps the number true.","*Which three digits wait for you?"],
        hint:"Don't walk through the passage yet. Stand at its opening and look at the building directly across from it for the number." },
      { t:"The Questionable Concoctions", l:"N", h:["a30cc9e7f0d2d1bf81dd121316bf0e68ca08327086f39c05facdb60cecf6457b"],
        c:["Beyond the alley, strange potions brew,\nWith stranger names for me and you.\nSome are sweet and some obscene,\nAnd others ought not grace a menu, I deem.","Among the words both wild and plenty,\nOne bears no words—just digits twenty.","*Find the name that numbers make,\nAnd that alone your prize shall take."],
        hint:"Scan the strange names on the list. One of them isn't a word at all. Type what it says." },
      { t:"Flowers for a Giant", l:"Z", h:["06727b9c3b1721f566f23d41a82e6e12e9310118fe7c0c05a4a29c31dc1259e0"],
        c:["A giant once came through this town,\nAnd great bright flowers sprang from the ground.\nSome stand proudly, straight and tall,\nWhile others rest where shadows fall.","Count the living bloom above,\nThen those who ride the boat below.","*Two numbers joined shall be your key—\nThe flowers' count will set you free."],
        hint:"Count the flowers standing up, then the ones on the boat. Write the two counts side by side, so a 2 and a 7 would make 27." },
      { t:"The Hands of Time", l:"H", h:["da03272f838d34c2cee1d4ead4937940c44279f5e013cea3d2dc0f875a7beaa1", "03bba0d84ca24d8d5ae15b05a7af461884f7586b457adf94e01467b98d7a8cd8"],
        c:["At the edge of an old brick wall,\nTwo hands appear without a call.\nThey reach as though to hold or show\nA distant sight that others cannot know.","Follow the wall beside the sea,\nUntil the strange pair beckon thee.","*What tool do these two hands embrace,\nTo spy upon some distant place?"],
        hint:"Follow the brick wall along the water until you see two hands. What are they holding up to look far away?" },
      { t:"The Final Race", l:"", h:[],
        c:["The road behind you now is done,\nThe final treasure has begun.\nOne last trail lies swift and straight,\nAnd somewhere there the answers wait.","Do not seek a sign or stone—\nThe final clue will be your own.","*Race the one who sent you here,\nAnd at the finish, look quite near.","Upon his bib, the final thread\nAwaits beneath the words you've read.","Take the key and turn the page.\nThe scattered letters now unlock the cage."],
        hint:"You already know who sent you here. Catch up to them and look at their race bib." }
    ];

    const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];
    const KEY = "treasure-hunt-v1";
    const $ = (id) => document.getElementById(id);
    const form = $("answerForm"), input = $("answer"), feedback = $("feedback"), hintButton = $("hintButton"), hint = $("hint"), reward = $("reward");

    const normalize = (s) => s.toLowerCase().replace(/^(the|a|an)\s+/, "").replace(/[^a-z0-9]/g, "");
    async function sha(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    const huntHash = (i, answer) => sha("hunt" + i + ":" + normalize(answer));

    let solved = 0;
    try {
      if (location.hash === "#reset") { localStorage.removeItem(KEY); history.replaceState(null, "", location.pathname); }
      solved = Math.min(parseInt(localStorage.getItem(KEY), 10) || 0, STOPS.length - 1);
    } catch (e) {}
    let cur = solved;

    function addTile(letter, animate) {
      const tile = document.createElement("div");
      tile.className = "tile" + (animate ? " new" : "");
      tile.textContent = letter;
      $("letters").appendChild(tile);
      $("lettersWrap").style.display = "block";
    }

    function render() {
      const s = STOPS[cur];
      $("title").textContent = s.t;
      $("stop").textContent = "Stop " + ROMAN[cur];
      $("bar").style.width = ((cur + 1) / STOPS.length * 100) + "%";
      const clue = $("clue");
      clue.textContent = "";
      s.c.forEach((para) => {
        const p = document.createElement("p");
        if (para[0] === "*") { p.className = "ask"; para = para.slice(1); }
        p.textContent = para;
        clue.appendChild(p);
      });
      hint.textContent = s.hint;
      hint.style.display = "none";
      hintButton.textContent = "I need a hint";
      hintButton.style.display = "block";
      feedback.textContent = ""; feedback.className = "feedback";
      reward.style.display = "none";
      input.value = ""; input.disabled = false; form.classList.remove("locked");
      form.style.display = s.h.length ? "flex" : "none";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const answer = normalize(input.value);
      if (!answer) { feedback.textContent = "Enter an answer first."; feedback.className = "feedback error"; return; }
      if (!window.crypto || !crypto.subtle) { feedback.textContent = "Open this page from its https link so answers can be checked."; feedback.className = "feedback error"; return; }
      const digest = await sha("hunt" + cur + ":" + answer);
      if (STOPS[cur].h.includes(digest)) {
        const s = STOPS[cur];
        solved = cur + 1;
        try { localStorage.setItem(KEY, solved); } catch (e) {}
        addTile(s.l, true);
        feedback.textContent = "Correct. The trail continues...";
        feedback.className = "feedback success";
        $("rewardLetter").textContent = s.l;
        reward.style.display = "block";
        input.disabled = true; form.classList.add("locked"); hintButton.style.display = "none"; hint.style.display = "none";
      } else {
        feedback.textContent = "Not quite. The trail remains hidden.";
        feedback.className = "feedback error";
      }
    });

    $("nextButton").addEventListener("click", () => { cur = solved; render(); window.scrollTo({ top: 0 }); });
    hintButton.addEventListener("click", () => { hint.style.display = "block"; hintButton.textContent = "Hint revealed"; });

    for (let i = 0; i < solved; i++) addTile(STOPS[i].l, false);
    render();
  </script>
</body>
</html>

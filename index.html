<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10263a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<title>The Birthday Treasure Hunt</title>
<style>
:root{--sea:#10263a;--sea2:#1a4560;--parch:#efe0bb;--parch2:#dcc48e;--ink:#2b2118;--muted:#6b563a;--brass:#b98a3b;--brass-d:#7f5c1c;--brass-l:#e8c477;--teal:#25686b;--wax:#8c2f2a;--ok:#2f6b45;--err:#9a3a2e;
--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .15 0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
--waves:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='40'><path d='M0 20 Q15 8 30 20 T60 20 T90 20 T120 20' fill='none' stroke='white' stroke-opacity='.06' stroke-width='1.5'/></svg>")}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;color:var(--ink);font-family:"IM Fell English",Georgia,"Times New Roman",serif;background:var(--waves),radial-gradient(ellipse at top,var(--sea2) 0,transparent 65%),var(--sea);padding:max(18px,env(safe-area-inset-top)) 14px max(26px,env(safe-area-inset-bottom))}
.hunt{width:min(680px,100%);margin:auto}
.header{text-align:center;margin-bottom:26px;color:var(--parch)}
.compass{width:64px;height:64px;display:block;margin:0 auto 10px}
.needle{transform-origin:50px 50px;animation:settle 1.8s cubic-bezier(.3,1.4,.5,1) both}
@keyframes settle{0%{transform:rotate(-80deg)}100%{transform:rotate(0)}}
.eyebrow{font-style:italic;font-size:1.05rem;color:rgba(239,224,187,.72);margin-bottom:4px}
h1{margin:0;font-family:"IM Fell English SC",Georgia,serif;font-weight:normal;font-size:clamp(1.9rem,8vw,3rem);line-height:1.15;letter-spacing:.02em;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.progress{position:relative;height:5px;margin:24px 16px 0 6px;background:repeating-linear-gradient(90deg,rgba(239,224,187,.4) 0 8px,transparent 8px 14px)}
.progress::after{content:"\2715";position:absolute;right:-16px;top:50%;transform:translateY(-52%);color:var(--wax);background:var(--parch);border-radius:50%;width:20px;height:20px;line-height:20px;font-size:.8rem;text-align:center;font-family:Georgia,serif}
.progress-bar{position:relative;width:0;height:100%;background:var(--brass-l);transition:width .6s ease}
.progress-bar::after{content:"";position:absolute;right:-7px;top:-5px;width:15px;height:15px;border-radius:50%;background:var(--brass-l);box-shadow:0 0 0 3px var(--sea),0 0 10px rgba(232,196,119,.6)}
.card{position:relative;background:var(--noise),radial-gradient(ellipse at center,#f6ebcd 0,var(--parch) 62%,var(--parch2) 100%);border-radius:5px;padding:clamp(28px,6vw,52px) clamp(20px,6vw,46px);box-shadow:0 0 0 3px var(--brass-d),0 0 0 5px #0a1824,0 22px 50px rgba(0,0,0,.5),inset 0 0 70px rgba(120,80,30,.3)}
.card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(90,62,30,.4);border-radius:3px;pointer-events:none}
.card .eyebrow{color:var(--muted)}
.stop{text-align:center;font-style:italic;font-size:1.05rem;color:var(--muted);margin-bottom:16px}
.clue{font-size:clamp(1.18rem,4.6vw,1.38rem);line-height:1.7;white-space:pre-line;text-align:center;max-width:30em;margin:0 auto 28px}
.form{display:flex;gap:10px;max-width:520px;margin:0 auto}
input{flex:1;min-width:0;padding:13px 14px;border:1px solid rgba(90,62,30,.55);border-radius:4px;font:inherit;font-size:1.1rem;background:rgba(255,250,235,.75);color:var(--ink);outline:none}
input:focus{border-color:var(--brass-d);box-shadow:0 0 0 3px rgba(185,138,59,.3)}
input::placeholder{color:rgba(107,86,58,.7);font-style:italic}
button{border:0;border-radius:4px;padding:13px 20px;min-height:46px;font:inherit;font-size:1.05rem;cursor:pointer;transition:background .15s ease}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.submit{background:var(--sea);color:var(--parch);box-shadow:inset 0 0 0 1px var(--brass)}
.submit:hover{background:var(--sea2)}
.hint-button{display:block;margin:12px auto 0;background:transparent;color:var(--muted);text-decoration:underline;font-style:italic;padding:10px}
.hint-button:hover{color:var(--ink)}
.hint,.answer-reveal,.lost-location{display:none;margin:16px auto 0;padding:13px 16px;max-width:520px;border-left:3px solid var(--brass);background:rgba(120,80,30,.1);text-align:left;line-height:1.55;font-size:1.08rem}
.hint{color:var(--muted);font-style:italic}
.lost-location{color:var(--teal);font-style:italic}
.answer-reveal strong{text-transform:capitalize;font-weight:normal;font-size:1.2em}
.give-up{display:none;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px auto 0}
.give-up-button,.lost-button{background:transparent;color:var(--muted);border:1px solid rgba(90,62,30,.5);padding:10px 16px;font-style:italic}
.give-up-button:hover,.lost-button:hover{color:var(--ink);background:rgba(120,80,30,.1)}
.feedback{min-height:28px;margin-top:16px;text-align:center;font-style:italic;font-size:1.1rem}
.success{color:var(--ok)}.error{color:var(--err)}
.locked{pointer-events:none;opacity:.6}
.reward{display:none;margin-top:24px;padding-top:22px;border-top:1px dashed rgba(90,62,30,.5);text-align:center}
.reward-text{color:var(--muted);font-style:italic}
.reward-letter{width:92px;height:92px;margin:14px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"IM Fell English SC",Georgia,serif;font-size:2.7rem;color:#f2cdbd;background:radial-gradient(circle at 35% 30%,#b8453d,var(--wax) 55%,#5a1d19);box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),inset 0 0 0 7px rgba(255,220,200,.12),0 5px 12px rgba(60,20,10,.5);text-shadow:0 -1px 0 rgba(0,0,0,.45),0 1px 0 rgba(255,200,180,.3);animation:stamp .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes stamp{from{transform:scale(1.7) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.next-button{display:none;margin:22px auto 0;background:var(--sea);color:var(--parch);box-shadow:inset 0 0 0 1px var(--brass)}
.next-button:hover{background:var(--sea2)}
.lost-wrap{margin-top:30px;padding-top:18px;border-top:1px dashed rgba(90,62,30,.5);text-align:center}
.final{display:none;text-align:center}
.final h2{font-family:"IM Fell English SC",Georgia,serif;font-weight:normal;font-size:clamp(1.6rem,6vw,2.1rem);margin:6px 0 14px}
.final p{line-height:1.65;font-size:1.15rem;margin:0 auto;max-width:30em}
.cipher-box{margin:26px auto;padding:18px 14px;background:#1a1510;color:var(--brass-l);border:1px solid var(--brass);border-radius:4px;font-family:"IM Fell English SC",Georgia,serif;font-size:clamp(1.3rem,6.4vw,1.9rem);letter-spacing:.16em;overflow-wrap:anywhere;box-shadow:inset 0 0 20px rgba(0,0,0,.6)}
.key-message{margin-top:22px}
.reset-wrap{text-align:center;margin-top:22px}
.reset-button{background:transparent;color:rgba(239,224,187,.6);font-size:.95rem;font-style:italic;text-decoration:underline;padding:10px 14px}
.reset-button:hover{color:var(--parch)}
@media(max-width:560px){body{padding-left:10px;padding-right:10px}.form{flex-direction:column}.submit{width:100%}.give-up-button{flex:1 1 100%}.card::before{inset:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="hunt">
<header class="header">
<svg class="compass" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="#b98a3b" stroke-width="2.5"/><circle cx="50" cy="50" r="38" fill="none" stroke="#b98a3b" stroke-width="1" stroke-dasharray="2 4"/><path d="M50 8 L57 43 L92 50 L57 57 L50 92 L43 57 L8 50 L43 43Z" fill="rgba(185,138,59,.3)" stroke="#b98a3b" stroke-width="1.5" stroke-linejoin="round"/><g class="needle"><path d="M50 16 L56 50 L44 50Z" fill="#c0453b"/><path d="M50 84 L56 50 L44 50Z" fill="#efe0bb"/></g><circle cx="50" cy="50" r="4" fill="#e8c477"/></svg>
<div class="eyebrow">A Birthday Treasure Hunt</div>
<h1 id="pageTitle">The First Mark</h1>
<div class="progress" aria-label="Progress"><div id="progressBar" class="progress-bar"></div></div>
</header>

<section id="card" class="card">
<div id="stopNumber" class="stop"></div>
<p id="clue" class="clue"></p>

<form id="answerForm" class="form">
<input id="answer" type="text" autocomplete="off" spellcheck="false" placeholder="Enter your answer..." aria-label="Answer">
<button class="submit" type="submit">Submit</button>
</form>

<button id="hintButton" class="hint-button" type="button">I need a hint</button>
<div id="hint" class="hint"></div>
<div id="giveUp" class="give-up">
<button id="revealButton" class="give-up-button" type="button">Reveal the answer</button>
<button id="skipButton" class="give-up-button" type="button">Skip this stop</button>
</div>
<div id="answerReveal" class="answer-reveal"></div>
<div id="feedback" class="feedback" aria-live="polite"></div>

<div id="reward" class="reward">
<div class="reward-text">You found the next letter.</div>
<div id="rewardLetter" class="reward-letter"></div>
<button id="nextButton" class="next-button" type="button">Continue the Hunt</button>
</div>

<div id="lostWrap" class="lost-wrap">
<button id="lostButton" class="lost-button" type="button">I am lost</button>
<div id="lostLocation" class="lost-location"></div>
</div>
</section>

<section id="final" class="card final">
<div class="eyebrow">The Final Revelation</div>
<h2>You have all fourteen letters.</h2>
<p>They are meaningless without the final key. When you reach the finish line, look at the race bib.</p>
<div class="cipher-box" id="cipherText"></div>
<p class="key-message">The key written there will reveal what your birthday treasure is.</p>
</section>

<div class="reset-wrap"><button id="resetButton" class="reset-button" type="button">Reset</button></div>
</main>

<script>
const clues = [
{title:"The Smallest Sailor",location:"The Baby",clue:`The smallest member of our crew
Has been entrusted with something for you.
He cannot walk, he cannot read,
Yet somehow holds what you now need.

He may complain. He may object.
He may demand a diaper check.

Seek the sailor, small and round,
The first secret on him is found.`,answer:"captain stinky",hint:"Inspect him carefully.",letter:"Q"},
  
{title:"The First Mark",location:"Confederation Fountain",clue:`Where Canada's emblems circle round,
Seek the odd one out you've found.
Not crown nor shield, nor shape so known—
One bears a form entirely its own.

Name the land that broke the mould,
And claim the letter you are told.`,answer:"nunavut",hint:"Look carefully at the shapes of the coats of arms. One is a circle.",letter:"H"},
  
{title:"The Two Travellers",location:"Demarcating Canada's Western Boundary",clue:`Two little wanderers, cast in bronze,
Keep watch where old frontiers were drawn.
Beneath their paws, where histories meet,
Three tongues recall an older seat.

One name comes east from lands you know,
And may strike closer than you suppose.

Take the given name of the man
Whose homeland echoes yours, if you can.`,answer:"petro",hint:"Think Ukrainian.",letter:"Z"},
  
{title:"The Lady and Her Companion",location:"Our Emily Statue",clue:`A painter waits upon the street,
With an unexpected friend so sweet.
But neither brush nor canvas shows
The name by which this lady goes.

Look not upon the statue's face,
But seek the words that mark the place.

Her given name is written there.`,answer:"emily",hint:"The statue's name is written right there.",letter:"B"},
  
{title:"The Watcher Above",location:"Mungo Martin House",clue:`Beyond the halls of gathered lore,
A wooden house keeps ancient score.
Great carved guardians mark the way,
And watching eyes are on display.

Seek the grin with teeth so wide,
Then look upon the pole beside.

What winged creature crowns the sky,
Resting where the tall carvings lie?`,answer:"eagle",hint:"Look for a bird at the very top.",letter:"H"},
  
{title:"The Palace of Fine Dining",location:"Old Spaghetti Factory",clue:`At last, a temple to cuisine—
The finest feast your eyes have seen.
A worthy shrine to pasta rare,
Where critics doubtless stop and stare.

Yet leave the menu on the shelf;
The answer hides upon the house itself.

Seek the name the building bears,
Written quietly for those who care.`,answer:"crystal garden",hint:"It's written beside the restaurant, not above its front door.",letter:"D"},
  
{title:"The Greatest Little Show",location:"The Miniature Museum",clue:`A world of wonders, shrunk to size,
Where little kingdoms wait inside.
A place we know, and know quite well,
Where tiny stories have tales to tell.

Above the door, a promise is made:

“The Greatest Little Show on ____.”

Complete the boast, and carry on.`,answer:"earth",hint:"It is right over the entrance.",letter:"U"},
  
{title:"The Zoo That Isn't",location:"Bug Zoo",clue:`Within this court there hides a place
Where many-legged things make their case.
No lion prowls, no tiger roars,
Yet still a keeper tends its doors.

Before you enter, look ahead—
A northern beast stands carved instead.

Name the creature guarding the zoo,
And let the next secret come to you.`,answer:"beaver",hint:"It is one of Canada's favourite animals—and no, it isn't a giant bug.",letter:"L"},
  
{title:"The Sweetest Trail",location:"Bon Macaron Bakery",clue:`A little Frenchman waits nearby,
With jaunty face and watchful eye.
He guards a house of sweets so small,
Where painted treasures line the wall.

Follow the trail of shell and cream,
And find the shop behind the dream.

But once you reach this sugary place,
Do not yet stop to taste.

Look for the words that bid you bite.
What three words are shining bright?`,answer:"take a bite",hint:"Look for a sign that prompts your bite.",letter:"Q"},
  
{title:"The Temptation",location:"Munro's Books",clue:`Beware the hall of printed dreams,
Where shelves conceal more books than seems.
We've entered once with empty hands
And left with treasures, contrary to plans.

A bookstore stands before your way—
A dangerous place for us to stay.
Today, resist—at least for now—
And turn your gaze outside somehow.

Upon the golden words you'll see
A year concealed for you and me.

What year first saw this building rise?`,answer:"1909",hint:"Check the large golden plaques just outside.",letter:"M"},

{title:"The Architect",location:"Irish Times Pub",clue:`Where Irish voices fill an ancient room,
And dark old timber hides the gloom,
A stately bank once held the floor
Where pints are raised there now instead.

The man who drew these walls with care
Would meet a darker fate elsewhere.

An architect of some renown,
Whose buildings still define this town,

Was murdered far from Canada.
What was his name?`,answer:"rattenbury",hint:"You may have to ask for a menu to read the story again.",letter:"D"},

{title:"The Birthday Coffee",location:"Starbucks at 819 Wharf Street",clue:`A green siren calls you near,
With free coffee, birthday cheer.
But downtown holds more than one,
So choose the one beside the sun.

Where sailors watch the harbour tide,
And homecoming waits just by its side,
Seek the shop where coffee steams—
Then look beyond the cups and creams.

Three little figures mark the door.
What number do they show?`,answer:"819",hint:"Look for a building number, should be nearby.",letter:"S"},
  
{title:"The Homecoming",location:"The Homecoming Statue",clue:`A sailor comes home across the sea,
And finds the arms of family.

A little girl runs out to meet
The sailor kneeling at her feet.

Yet do not linger with the pair—
Another sailor waits nearby.

He sits in silence, calm and still,
Watching over all the while.

Look beneath the sailor's cap.
What ship's name does he wear?`,answer:"hmcs naden",hint:"All ships names start with HMCS.",letter:"D"}
];

let currentStop=0;
let completedLetters=[];
let skipped=false; // true if the current stop was skipped rather than answered
let solved=false; // true when the current stop has been answered but "Continue" not yet clicked
const STORAGE_KEY="birthdayTreasureHuntProgress";

function saveProgress(){
try{localStorage.setItem(STORAGE_KEY,JSON.stringify({currentStop,completedLetters,solved,skipped}));}catch(e){}
}
function clearProgress(){
try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
}
function loadProgress(){
try{
const data=JSON.parse(localStorage.getItem(STORAGE_KEY));
if(data&&Number.isInteger(data.currentStop)&&data.currentStop>=0&&data.currentStop<=clues.length&&Array.isArray(data.completedLetters)){
currentStop=data.currentStop;
completedLetters=data.completedLetters;
solved=!!data.solved&&currentStop<clues.length;
skipped=solved&&!!data.skipped;
}
}catch(e){}
}

const pageTitle=document.getElementById("pageTitle"),stopNumber=document.getElementById("stopNumber"),lostWrap=document.getElementById("lostWrap"),lostButton=document.getElementById("lostButton"),lostLocation=document.getElementById("lostLocation"),clueEl=document.getElementById("clue"),progressBar=document.getElementById("progressBar"),answerForm=document.getElementById("answerForm"),answerInput=document.getElementById("answer"),hintButton=document.getElementById("hintButton"),hintEl=document.getElementById("hint"),feedback=document.getElementById("feedback"),reward=document.getElementById("reward"),rewardLetter=document.getElementById("rewardLetter"),nextButton=document.getElementById("nextButton"),card=document.getElementById("card"),final=document.getElementById("final"),cipherText=document.getElementById("cipherText"),resetButton=document.getElementById("resetButton"),giveUp=document.getElementById("giveUp"),revealButton=document.getElementById("revealButton"),skipButton=document.getElementById("skipButton"),answerReveal=document.getElementById("answerReveal");

function showSolved(){
feedback.textContent=skipped?"Skipped. The trail continues...":"Correct. The trail continues...";
feedback.className="feedback success";
rewardLetter.textContent=completedLetters[completedLetters.length-1];
reward.style.display="block";
answerInput.disabled=true;
answerForm.classList.add("locked");
hintButton.style.display="none";
giveUp.style.display="none";
answerReveal.style.display="none";
lostWrap.style.display="none";
nextButton.textContent=currentStop<clues.length-1?"Continue the Hunt":"See Your Cipher";
nextButton.style.display="block";
}
function showFinal(){
card.style.display="none";
pageTitle.textContent="The Final Key";
progressBar.style.width="100%";
final.style.display="block";
cipherText.textContent=completedLetters.join("");
}
function normalizeAnswer(value){
return value.trim().toLowerCase().replace(/\s+/g," ");
}
function loadStop(index){
const stop=clues[index];
card.style.display="";
final.style.display="none";
pageTitle.textContent=stop.title;
stopNumber.textContent=`Stop ${index+1} of ${clues.length}`;
lostLocation.textContent="Your next stop: "+stop.location;
lostLocation.style.display="none";
lostWrap.style.display="block";
lostButton.style.display="inline-block";
clueEl.textContent=stop.clue;
hintEl.textContent=stop.hint;
answerInput.value="";
answerInput.disabled=false;
answerForm.classList.remove("locked");
feedback.textContent="";
feedback.className="feedback";
reward.style.display="none";
nextButton.style.display="none";
hintEl.style.display="none";
hintButton.style.display="block";
hintButton.textContent="I need a hint";
giveUp.style.display="none";
revealButton.style.display="inline-block";
answerReveal.style.display="none";
answerReveal.innerHTML="";
progressBar.style.width=`${(index/14)*100}%`;
setTimeout(()=>answerInput.focus(),100);
}
answerForm.addEventListener("submit",(event)=>{
event.preventDefault();
const stop=clues[currentStop],answer=normalizeAnswer(answerInput.value);
if(!answer){feedback.textContent="Enter an answer first.";feedback.className="feedback error";return;}
if(answer===stop.answer){
completedLetters.push(stop.letter);
solved=true;
skipped=false;
saveProgress();
showSolved();
}else{
feedback.textContent="Not quite. The trail remains hidden.";
feedback.className="feedback error";
}
});
lostButton.addEventListener("click",()=>{
lostLocation.style.display="block";
lostButton.style.display="none";
});
hintButton.addEventListener("click",()=>{
hintEl.style.display="block";
hintButton.textContent="Hint revealed";
giveUp.style.display="flex";
});
revealButton.addEventListener("click",()=>{
const strong=document.createElement("strong");
strong.textContent=clues[currentStop].answer;
answerReveal.innerHTML="";
answerReveal.append("The answer is: ",strong);
answerReveal.style.display="block";
revealButton.style.display="none";
});
skipButton.addEventListener("click",()=>{
if(!confirm("Skip this stop? You'll still receive its letter.")){return;}
completedLetters.push(clues[currentStop].letter);
solved=true;
skipped=true;
saveProgress();
showSolved();
});
nextButton.addEventListener("click",()=>{
currentStop++;
solved=false;
skipped=false;
saveProgress();
if(currentStop<clues.length){loadStop(currentStop);}
else{showFinal();}
});

resetButton.addEventListener("click",()=>{
if(confirm("Are you sure you want to reset? All progress will be lost and you'll start over at Stop 1.")){
currentStop=0;
completedLetters=[];
solved=false;
skipped=false;
clearProgress();
loadStop(0);
}
});

// Restore saved progress (if any)
loadProgress();
if(currentStop>=clues.length){showFinal();}
else{
loadStop(currentStop);
if(solved){showSolved();}
}
</script>
</body>
</html>
